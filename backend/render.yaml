services:
  - type: web
    name: mereitoi-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mereitoi-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_KEY
        sync: false

databases:
  - name: mereitoi-db
    plan: free
